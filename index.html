<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151517">
<script>try{var t=JSON.parse(localStorage.getItem('agirlik-takip-v1')||'{}').tema||'koyu';if(!JSON.parse(localStorage.getItem('agirlik-takip-v1')||'{}').temaV&&t==='acik')t='koyu';if(t!=='sistem')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ağırlık Takip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <div id="rest" hidden></div>
  <nav id="tabs" aria-label="Ana menü">
    <div class="marka" aria-hidden="true"><img src="icon.svg" alt="" width="30" height="30">Ağırlık Takip</div>
    <button data-tab="bugun"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Bugün</button>
    <button data-tab="gecmis"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>Geçmiş</button>
    <button data-tab="ilerleme"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18.5l5-5.5 4 3.5 7-8"/><path d="M15.5 8.5H20V13"/></svg>İlerleme</button>
    <button data-tab="takviye"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3.5" width="10" height="3.5" rx="1"/><rect x="5.5" y="7" width="13" height="13.5" rx="2.5"/><path d="M9 12.5h6M9 15.5h4"/></svg>Takviye</button>
    <button data-tab="ayarlar"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ayarlar</button>
    <button class="tema-dugme" data-act="tema-cevir" aria-label="Açık / koyu tema"><svg class="ay" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg><svg class="gunes" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span class="ay">Koyu tema</span><span class="gunes">Açık tema</span></button>
    <button class="kisayol" data-act="kisayol">Klavye kısayolları <kbd>?</kbd></button>
  </nav>
</div>
<div id="sheet" hidden></div>
